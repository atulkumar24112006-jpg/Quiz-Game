<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #080D18;
    --bg-2: #0C1424;
    --panel: rgba(18,27,48,0.72);
    --panel-solid: #121B30;
    --border: rgba(255,255,255,0.08);
    --cyan: #4CE0D2;
    --violet: #9C8CFB;
    --text: #EAF0F7;
    --muted: #7C8AA0;
    --correct: #3ECF8E;
    --wrong: #FF6B7A;
    --amber: #FFC168;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(76,224,210,0.14), transparent 60%),
      radial-gradient(ellipse 800px 500px at 100% 10%, rgba(156,140,251,0.14), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image: radial-gradient(ellipse 100% 100% at 50% 0%, black 0%, transparent 75%);
    pointer-events:none;
    z-index:0;
  }
  .bg-watermark{
    position:fixed;
    top:50%; left:50%;
    width:1100px; height:1100px;
    transform:translate(-50%,-50%);
    opacity:0.045;
    pointer-events:none;
    z-index:0;
  }
  .bg-watermark svg{width:100%; height:100%;}

  .console{
    width:100%;
    max-width:600px;
    position:relative;
    z-index:1;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    padding:0 4px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .atom{
    width:26px; height:26px;
    position:relative;
  }
  .atom .core{
    position:absolute; top:50%; left:50%;
    width:6px; height:6px; border-radius:50%;
    background:var(--cyan);
    transform:translate(-50%,-50%);
    box-shadow:0 0 10px var(--cyan);
  }
  .atom .ring{
    position:absolute; inset:0;
    border:1.5px solid rgba(76,224,210,0.55);
    border-radius:50%;
  }
  .atom .ring.r2{
    transform:rotate(60deg);
    border-color:rgba(156,140,251,0.55);
  }
  .atom .ring.r3{transform:rotate(-60deg);}
  .atom .electron{
    position:absolute; top:-2px; left:50%;
    width:4px; height:4px; margin-left:-2px;
    border-radius:50%;
    background:var(--violet);
    box-shadow:0 0 6px var(--violet);
    animation:orbit 3.4s linear infinite;
  }
  @keyframes orbit{
    from{transform:rotate(0deg) translateX(13px) rotate(0deg);}
    to{transform:rotate(360deg) translateX(13px) rotate(-360deg);}
  }
  .brand-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:0.02em;
  }
  .status-dot{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .status-dot span.dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--correct);
    box-shadow:0 0 6px var(--correct);
  }

  .panel{
    background:var(--panel);
    backdrop-filter:blur(18px);
    border:1px solid var(--border);
    border-radius:20px;
    padding:32px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
    min-height:520px;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .panel::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
    opacity:0.6;
  }
  .watermark{
    position:absolute;
    top:50%; left:50%;
    width:640px; height:640px;
    transform:translate(-50%,-50%);
    opacity:0.05;
    pointer-events:none;
    z-index:0;
  }
  .watermark svg{width:100%; height:100%;}
  .panel > *:not(.watermark){position:relative; z-index:1;}

  .screen{display:none; flex-direction:column; flex:1;}
  .screen.active{display:flex;}

  h1.hero-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:1.7rem;
    margin:0 0 4px;
    background:linear-gradient(90deg, var(--text), var(--cyan));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero-sub{
    color:var(--muted);
    font-size:0.85rem;
    margin-bottom:26px;
  }

  .field-label{
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--muted);
    margin-bottom:10px;
    margin-top:20px;
  }
  .field-label:first-of-type{margin-top:0;}

  input[type=text]{
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  input[type=text]:focus{border-color:var(--cyan); background:rgba(76,224,210,0.06);}
  input[type=text]::placeholder{color:var(--muted);}

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:10px;
  }
  .cat-card{
    display:flex; flex-direction:column; gap:8px;
    padding:14px;
    border:1px solid var(--border);
    border-radius:12px;
    background:rgba(255,255,255,0.03);
    cursor:pointer;
    transition:all .15s ease;
  }
  .cat-card:hover{border-color:rgba(76,224,210,0.4); transform:translateY(-2px);}
  .cat-card.selected{
    border-color:var(--cyan);
    background:rgba(76,224,210,0.08);
    box-shadow:0 0 0 1px rgba(76,224,210,0.3), 0 8px 20px rgba(76,224,210,0.12);
  }
  .cat-card .icon{width:22px; height:22px; color:var(--cyan);}
  .cat-card .label{font-weight:600; font-size:0.9rem;}
  .cat-card .sub{font-size:0.7rem; color:var(--muted); font-family:'JetBrains Mono', monospace;}

  .diff-row{display:flex; gap:10px;}
  .diff-pill{
    flex:1;
    text-align:center;
    padding:12px 8px;
    border-radius:12px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.03);
    cursor:pointer;
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:0.82rem;
    transition:all .15s ease;
    position:relative;
  }
  .diff-pill:hover{transform:translateY(-2px);}
  .diff-pill.count.selected{border-color:var(--cyan); background:rgba(76,224,210,0.1); color:var(--cyan); box-shadow:0 0 20px rgba(76,224,210,0.15);}
  .diff-pill[data-level="Easy"].selected{border-color:var(--correct); background:rgba(62,207,142,0.1); color:var(--correct); box-shadow:0 0 20px rgba(62,207,142,0.15);}
  .diff-pill[data-level="Moderate"].selected{border-color:var(--amber); background:rgba(255,193,104,0.1); color:var(--amber); box-shadow:0 0 20px rgba(255,193,104,0.15);}
  .diff-pill[data-level="Hard"].selected{border-color:var(--wrong); background:rgba(255,107,122,0.1); color:var(--wrong); box-shadow:0 0 20px rgba(255,107,122,0.15);}

  button.btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    letter-spacing:0.01em;
    background:linear-gradient(90deg, var(--cyan), var(--violet));
    color:#081018;
    border:none;
    border-radius:12px;
    padding:14px 22px;
    cursor:pointer;
    margin-top:auto;
    transition:opacity .15s ease, transform .1s ease;
  }
  button.btn:hover{opacity:0.9;}
  button.btn:active{transform:scale(0.98);}
  button.btn:disabled{background:rgba(255,255,255,0.08); color:var(--muted); cursor:not-allowed;}
  button.btn.secondary{
    background:rgba(255,255,255,0.06);
    color:var(--text);
    border:1px solid var(--border);
  }
  button.btn.secondary:hover{background:rgba(255,255,255,0.1); opacity:1;}
  .row-buttons{display:flex; gap:12px; margin-top:auto;}
  .row-buttons .btn{margin-top:0; flex:1;}

  /* GAME SCREEN */
  .quiz-top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px;
  }
  .quiz-progress-label{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.1em;
  }
  .timer-ring-wrap{position:relative; width:52px; height:52px;}
  .timer-ring-wrap svg{transform:rotate(-90deg);}
  .timer-ring-bg{fill:none; stroke:rgba(255,255,255,0.08); stroke-width:4;}
  .timer-ring-fill{
    fill:none; stroke:var(--cyan); stroke-width:4; stroke-linecap:round;
    transition:stroke-dashoffset 1s linear, stroke .3s ease;
  }
  .timer-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:0.85rem;
  }

  .progress-track{
    height:4px; background:rgba(255,255,255,0.08); border-radius:4px;
    margin-bottom:22px; overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--cyan), var(--violet));
    transition:width .3s ease;
  }

  .question-text{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1.15rem;
    line-height:1.5;
    margin-bottom:22px;
  }

  .answers{display:flex; flex-direction:column; gap:10px; margin-bottom:8px;}
  .answer-option{
    display:flex; align-items:center; gap:12px;
    padding:13px 15px;
    border:1px solid var(--border);
    border-radius:12px;
    cursor:pointer;
    background:rgba(255,255,255,0.03);
    transition:all .15s ease;
  }
  .answer-option:hover{background:rgba(76,224,210,0.06); border-color:rgba(76,224,210,0.3);}
  .answer-option .letter{
    width:26px; height:26px; border-radius:8px;
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size:0.75rem; font-weight:700;
    flex-shrink:0;
    color:var(--muted);
  }
  .answer-option .txt{font-size:0.9rem;}
  .answer-option.correct{
    background:rgba(62,207,142,0.1); border-color:var(--correct);
    box-shadow:0 0 20px rgba(62,207,142,0.15);
  }
  .answer-option.correct .letter{border-color:var(--correct); color:var(--correct);}
  .answer-option.wrong{
    background:rgba(255,107,122,0.1); border-color:var(--wrong);
    box-shadow:0 0 20px rgba(255,107,122,0.15);
  }
  .answer-option.wrong .letter{border-color:var(--wrong); color:var(--wrong);}
  .answer-option.disabled{cursor:default;}

  .pulse-flash{
    position:absolute; inset:0;
    border-radius:20px;
    pointer-events:none;
    opacity:0;
  }
  .pulse-flash.show{animation:pulseFlash .6s ease-out forwards;}
  .pulse-flash.correct{box-shadow:inset 0 0 80px rgba(62,207,142,0.5);}
  .pulse-flash.wrong{box-shadow:inset 0 0 80px rgba(255,107,122,0.5);}
  @keyframes pulseFlash{
    0%{opacity:0;}
    30%{opacity:1;}
    100%{opacity:0;}
  }

  /* RESULTS SCREEN */
  .results-top{
    display:flex; align-items:center; gap:22px; margin-bottom:24px;
  }
  .score-ring-wrap{position:relative; width:104px; height:104px; flex-shrink:0;}
  .score-ring-wrap svg{transform:rotate(-90deg);}
  .score-ring-bg{fill:none; stroke:rgba(255,255,255,0.08); stroke-width:7;}
  .score-ring-fill{
    fill:none; stroke:url(#scoreGrad); stroke-width:7; stroke-linecap:round;
    transition:stroke-dashoffset 1s ease;
  }
  .score-ring-text{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:1.5rem;
  }
  .results-meta .grade-word{
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--muted);
    margin-bottom:4px;
  }
  .results-meta .score-line{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1.1rem;
    margin-bottom:6px;
  }
  .results-meta .tag-line{
    font-size:0.78rem;
    color:var(--muted);
  }

  .scoreboard{
    border-top:1px solid var(--border);
    padding-top:16px;
    margin-top:auto;
  }
  .scoreboard h3{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--muted);
    margin:0 0 12px;
  }
  .score-entry{
    display:flex; justify-content:space-between; align-items:center;
    font-size:0.82rem;
    padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,0.04);
  }
  .score-entry:last-child{border-bottom:none;}
  .score-entry .who{font-weight:600;}
  .score-entry .meta{color:var(--muted); font-size:0.72rem; font-family:'JetBrains Mono', monospace;}

  @media (max-width:480px){
    .panel{padding:24px 18px;}
    h1.hero-title{font-size:1.4rem;}
    .score-ring-wrap{width:84px; height:84px;}
    .score-ring-text{font-size:1.2rem;}
  }

  /* ================= ENHANCEMENTS ================= */

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }

  /* particle canvas */
  #particles{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }

  /* ---- splash / boot screen ---- */
  #splash{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg);
    gap:22px;
    transition:opacity .6s ease, visibility .6s ease;
  }
  #splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .splash-atom{width:64px; height:64px; position:relative;}
  .splash-atom .core{
    position:absolute; top:50%; left:50%; width:14px; height:14px; border-radius:50%;
    background:var(--cyan); transform:translate(-50%,-50%);
    box-shadow:0 0 22px var(--cyan), 0 0 50px rgba(76,224,210,0.5);
    animation:corePulse 1.6s ease-in-out infinite;
  }
  @keyframes corePulse{0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.25);}}
  .splash-atom .ring{position:absolute; inset:0; border:2px solid rgba(76,224,210,0.45); border-radius:50%;}
  .splash-atom .ring.r2{transform:rotate(60deg); border-color:rgba(156,140,251,0.45);}
  .splash-atom .ring.r3{transform:rotate(-60deg); border-color:rgba(255,193,104,0.35);}
  .splash-atom .electron{
    position:absolute; top:-3px; left:50%; width:8px; height:8px; margin-left:-4px; border-radius:50%;
    background:var(--violet); box-shadow:0 0 12px var(--violet);
    animation:orbit 2.2s linear infinite;
  }
  .splash-title{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:1.3rem;
    letter-spacing:0.02em;
    background:linear-gradient(90deg, var(--cyan), var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .splash-sub{
    font-family:'JetBrains Mono', monospace; font-size:0.72rem; color:var(--muted);
    letter-spacing:0.08em; text-transform:uppercase; min-height:1em;
  }
  .splash-sub .caret{display:inline-block; width:6px; height:11px; background:var(--cyan); margin-left:2px; vertical-align:-1px; animation:blink 0.9s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .splash-bar{
    width:180px; height:3px; border-radius:3px; background:rgba(255,255,255,0.08); overflow:hidden;
  }
  .splash-bar-fill{
    height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg, var(--cyan), var(--violet));
    animation:splashLoad 1.7s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes splashLoad{ to{width:100%;} }

  /* console entrance */
  .console{animation:consoleIn .7s cubic-bezier(.16,1,.3,1) both; animation-delay:1.5s;}
  @keyframes consoleIn{
    from{opacity:0; transform:translateY(18px) scale(0.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  /* title glow breathing */
  h1.hero-title{animation:titleGlow 4s ease-in-out infinite;}
  @keyframes titleGlow{
    0%,100%{filter:drop-shadow(0 0 0 rgba(76,224,210,0));}
    50%{filter:drop-shadow(0 0 10px rgba(76,224,210,0.35));}
  }

  /* screen transitions (entrance animation only, layout stays in normal flow) */
  .screen.active{
    animation:screenIn .45s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes screenIn{
    from{opacity:0; transform:translateX(14px);}
    to{opacity:1; transform:translateX(0);}
  }

  /* staggered entrance for interactive rows */
  .cat-card, .diff-pill{
    animation:itemIn .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes itemIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* card hover polish */
  .cat-card{will-change:transform;}
  .cat-card:hover{transform:translateY(-3px) scale(1.015);}
  .cat-card.selected{animation:selectPop .35s ease;}
  @keyframes selectPop{0%{transform:scale(0.97);} 60%{transform:scale(1.02);} 100%{transform:scale(1);}}

  /* button ripple */
  button.btn{position:relative; overflow:hidden;}
  .ripple{
    position:absolute; border-radius:50%; background:rgba(255,255,255,0.5);
    transform:scale(0); animation:rippleAnim .55s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleAnim{ to{transform:scale(2.6); opacity:0;} }

  /* answer option entrance + tap feedback */
  .answer-option{animation:answerIn .4s cubic-bezier(.16,1,.3,1) both; will-change:transform;}
  .answer-option:active{transform:scale(0.985);}
  .answer-option.correct{animation:correctPop .4s ease;}
  .answer-option.wrong{animation:shakeWrong .4s ease;}
  @keyframes correctPop{0%{transform:scale(1);} 40%{transform:scale(1.02);} 100%{transform:scale(1);}}
  @keyframes shakeWrong{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
  }

  /* timer low state pulse */
  .timer-ring-wrap.low .timer-num{animation:timerPulse 0.9s ease-in-out infinite;}
  @keyframes timerPulse{0%,100%{transform:scale(1); color:var(--wrong);} 50%{transform:scale(1.18); color:var(--wrong);}}

  /* streak badge */
  .streak-badge{
    display:flex; align-items:center; gap:5px;
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:0.72rem;
    color:var(--amber);
    background:rgba(255,193,104,0.08);
    border:1px solid rgba(255,193,104,0.25);
    padding:5px 10px; border-radius:20px;
    opacity:0; transform:translateY(-6px) scale(0.8);
    transition:opacity .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .streak-badge.show{opacity:1; transform:translateY(0) scale(1);}
  .streak-badge .flame{animation:flameFlicker 0.6s ease-in-out infinite alternate;}
  @keyframes flameFlicker{from{transform:scale(1) rotate(-2deg);} to{transform:scale(1.12) rotate(2deg);}}

  /* score ring reveal glow */
  .score-ring-wrap{animation:scoreRingIn .5s cubic-bezier(.16,1,.3,1) both;}
  @keyframes scoreRingIn{from{opacity:0; transform:scale(0.85);} to{opacity:1; transform:scale(1);}}
  .grade-word, .score-line, .tag-line{animation:fadeUpSmall .5s cubic-bezier(.16,1,.3,1) both;}
  .score-line{animation-delay:.08s;}
  .tag-line{animation-delay:.14s;}
  @keyframes fadeUpSmall{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* confetti canvas */
  #confetti{position:fixed; inset:0; z-index:40; pointer-events:none;}

  /* sound toggle */
  .sound-toggle{
    display:flex; align-items:center; justify-content:center;
    width:28px; height:28px; border-radius:8px;
    border:1px solid var(--border); background:rgba(255,255,255,0.03);
    color:var(--muted); cursor:pointer; transition:all .15s ease;

  .status-row{display:flex; align-items:center;}


  /* ================= AESTHETIC MOTION LAYER ================= */
  /* drifting aurora glow behind the console */
  body::after{
    content:""; position:fixed; inset:-20%; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle 360px at 20% 30%, rgba(76,224,210,0.13), transparent 70%),
      radial-gradient(circle 420px at 80% 70%, rgba(156,140,251,0.14), transparent 70%),
      radial-gradient(circle 300px at 60% 15%, rgba(255,193,104,0.07), transparent 70%);
    filter:blur(30px);
    animation:aurora 18s ease-in-out infinite alternate;
  }
  @keyframes aurora{
    0%{transform:translate(-3%,-2%) scale(1);}
    50%{transform:translate(4%,3%) scale(1.08);}
    100%{transform:translate(-2%,5%) scale(1.02);}
  }

  /* panel: gently floating glass with a flowing top line */
  .panel{animation:panelFloat 7s ease-in-out infinite;}
  @keyframes panelFloat{0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);}}
  .panel::before{
    background:linear-gradient(90deg, transparent, var(--cyan), var(--violet), var(--cyan), transparent);
    background-size:200% 100%;
    animation:flowLine 4s linear infinite;
  }
  @keyframes flowLine{from{background-position:0% 0;} to{background-position:200% 0;}}

  /* category cards: lift, glow, light sweep */
  .cat-card{position:relative; overflow:hidden; transition:transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease, border-color .25s ease, background .25s ease;}
  .cat-card::after{
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.12), transparent);
    transform:skewX(-20deg); transition:left .6s ease; pointer-events:none;
  }
  .cat-card:hover{transform:translateY(-4px); box-shadow:0 12px 30px rgba(76,224,210,0.14);}
  .cat-card:hover::after{left:130%;}
  .cat-card.selected{animation:selectPop .35s ease, glowBreathe 2.6s ease-in-out .35s infinite;}
  @keyframes glowBreathe{
    0%,100%{box-shadow:0 0 0 rgba(76,224,210,0);}
    50%{box-shadow:0 0 24px rgba(76,224,210,0.28);}
  }
  .diff-pill.selected{animation:selectPop .35s ease;}

  /* start button: breathing glow when ready, shimmer sweep on hover */
  button.btn:not(:disabled){animation:btnBreathe 2.8s ease-in-out infinite;}
  @keyframes btnBreathe{
    0%,100%{box-shadow:0 0 0 rgba(76,224,210,0);}
    50%{box-shadow:0 6px 28px rgba(76,224,210,0.35);}
  }
  button.btn::after{
    content:""; position:absolute; top:0; left:-70%; width:50%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.35), transparent);
    transform:skewX(-20deg); pointer-events:none;
  }
  button.btn:not(:disabled):hover::after{left:140%; transition:left .7s ease;}

  /* progress bar: glowing, moving highlight */
  .progress-fill{
    position:relative;
    background-size:200% 100%;
    box-shadow:0 0 12px rgba(76,224,210,0.6);
    transition:width .6s cubic-bezier(.16,1,.3,1);
  }
  .progress-fill::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    animation:barShine 2.2s ease-in-out infinite;
  }
  @keyframes barShine{from{transform:translateX(-100%);} to{transform:translateX(100%);}}

  /* question text + options entrance (re-triggered on every question) */
  .question-text{animation:qIn .55s cubic-bezier(.16,1,.3,1) both;}
  @keyframes qIn{from{opacity:0; transform:translateY(12px); filter:blur(4px);} to{opacity:1; transform:none; filter:blur(0);}}
  .answer-option{animation:optIn .55s cubic-bezier(.16,1,.3,1) both;}
  @keyframes optIn{from{opacity:0; transform:translateX(-18px);} to{opacity:1; transform:translateX(0);}}
  .answer-option:not(.correct):not(.wrong):hover{transform:translateX(6px);}
  .answer-option.correct{animation:correctPop .45s ease, ringOut .8s ease-out;}
  @keyframes ringOut{
    from{box-shadow:0 0 0 0 rgba(62,207,142,0.55);}
    to{box-shadow:0 0 0 16px rgba(62,207,142,0);}
  }
</style>

let audioCtx = null;
function beep(freq, dur, type){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
el('soundToggle').addEventListener('click', ()=>{
  soundOn = !soundOn;
  el('soundIconOn').style.display = soundOn ? 'block' : 'none';
  el('soundIconOff').style.display = soundOn ? 'none' : 'block';
  if(soundOn) beep(660,0.08,'sine');
});

document.addEventListener('click', (e)=>{
  const btn = e.target.closest('button.btn');
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement('span');
  const size = Math.max(rect.width, rect.height) * 1.2;
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size+'px';
  ripple.style.left = (e.clientX - rect.left - size/2)+'px';
  ripple.style.top = (e.clientY - rect.top - size/2)+'px';
  btn.appendChild(ripple);
  setTimeout(()=> ripple.remove(), 600);
});

/* ---------- PARTICLE BACKGROUND ---------- */
(function(){
  const canvas = el('particles');
  const ctx = canvas.getContext('2d');
  let w,h,particles;
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function initParticles(){
    const count = Math.min(60, Math.floor((w*h)/28000));
    particles = Array.from({length:count}, ()=>({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.25, vy: (Math.random()-0.5)*0.25,
      r: Math.random()*1.6+0.6,
      hue: Math.random()>0.5 ? '76,224,210' : '156,140,251'
    }));
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      if(p.x<0||p.x>w) p.vx*=-1;
      if(p.y<0||p.y>h) p.vy*=-1;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(${p.hue},0.5)`;
      ctx.fill();
    }
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const a=particles[i], b=particles[j];
        const dx=a.x-b.x, dy=a.y-b.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist<120){
          ctx.strokeStyle = `rgba(76,224,210,${0.08*(1-dist/120)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', ()=>{ resize(); initParticles(); });
  resize(); initParticles(); tick();
})();

/* ---------- CONFETTI ---------- */
function fireConfetti(){
  const canvas = el('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colors = ['#4CE0D2','#9C8CFB','#FFC168','#3ECF8E','#FF6B7A'];
  let pieces = Array.from({length:130}, ()=>({
    x: canvas.width/2 + (Math.random()-0.5)*160,
    y: canvas.height*0.35 + (Math.random()-0.5)*60,
    vx:(Math.random()-0.5)*8,
    vy: Math.random()*-9 - 3,
    size: Math.random()*7+4,
    color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*360,
    vr:(Math.random()-0.5)*14,
    life:0
  }));
  const gravity = 0.28;
  function frame(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    for(const p of pieces){
      p.life++;
      p.vy += gravity; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if(p.y < canvas.height + 20) alive = true;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - p.life/160);
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    }
    if(alive) requestAnimationFrame(frame);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  frame();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

});

el('playerName').addEventListener('input', (e)=>{
  state.name = e.target.value.trim();
  checkStartReady();
});

function checkStartReady(){
  el('startBtn').disabled = !(state.name.length>0 && state.category && state.difficulty);
}

el('startBtn').addEventListener('click', startQuiz);

/* ---------- QUIZ LOGIC ---------- */
function decodeHTML(text){
  const textarea = document.createElement('textarea');
  textarea.innerHTML = text;
  return textarea.value;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function getJSON(url, timeout=8000){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), timeout);
  try{
    const res = await fetch(url, { cache:'no-store', signal:ctrl.signal });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally { clearTimeout(t); }
}

async function ensureToken(reset=false){
  const cmd = (reset && sessionToken) ? `command=reset&token=${sessionToken}` : 'command=request';
  const data = await getJSON(`${TOKEN_URL}?${cmd}`);
  if(data.token) sessionToken = data.token;
}

async function fetchAPIQuestions(attempt=0){
  const difficulty = state.difficulty === 'Moderate' ? 'medium' : state.difficulty.toLowerCase();
  const category = API_CATEGORY[state.category];
  if(!sessionToken){ try{ await ensureToken(); }catch(e){} }

  const params = new URLSearchParams({ amount: state.count, difficulty, type:'multiple' });
  if(category) params.set('category', category);
  if(sessionToken) params.set('token', sessionToken);

  const data = await getJSON(`${API_URL}?${params}`);

  // response_code: 0 ok, 1 not enough questions, 4 token exhausted, 5 rate limited
  if(data.response_code === 5 && attempt < 2){ await sleep(5200); return fetchAPIQuestions(attempt+1); }
  if(data.response_code === 4 && attempt < 2){ await ensureToken(true); return fetchAPIQuestions(attempt+1); }
  if(data.response_code === 1 && state.count > 10 && attempt < 3){
    state.count = Math.max(10, Math.floor(state.count/2));   // retry with fewer questions
    return fetchAPIQuestions(attempt+1);
  }
  if(data.response_code !== 0 || !Array.isArray(data.results) || !data.results.length){
    throw new Error(`Open Trivia DB response code: ${data.response_code}`);
  }

  return data.results.map(item => ({
    q: decodeHTML(item.question),
    options: [item.correct_answer, ...item.incorrect_answers].map(decodeHTML),
    answer: decodeHTML(item.correct_answer)
  }));
}

function setApiStatus(live, n, local){
  el('apiStatus').textContent = live ? 'API Live' : local ? `Local Bank (${n} Qs)` : `Offline Mode (${n} Qs)`;
}

function useLocalQuestions(){
  // Strictly subject-wise: fill from chosen difficulty first, then the other levels of the same subject.
  const bank = QUESTIONS[state.category];
  const levels = [state.difficulty, ...['Easy','Moderate','Hard'].filter(l => l!==state.difficulty)];
  const picked = [];
  for(const lvl of levels){
    if(picked.length >= state.count) break;
    picked.push(...shuffle(bank[lvl]));
  }
  return picked.slice(0, state.count);
}

async function startQuiz(){
  const startBtn = el('startBtn');
  const originalText = startBtn.textContent;
  startBtn.disabled = true;
  startBtn.textContent = `Loading ${state.count} Questions…`;

  try{
    if(LOCAL_ONLY.includes(state.category)) throw new Error('local-only subject');
    state.questions = shuffle(await fetchAPIQuestions());
    setApiStatus(true);
  }catch(error){
    console.warn('Quiz API unavailable. Using built-in questions instead.', error);
    state.questions = useLocalQuestions();
    setApiStatus(false, state.questions.length, LOCAL_ONLY.includes(state.category));
  }

  state.index = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  updateStreakBadge();
  startBtn.textContent = originalText;
  checkStartReady();
  showScreen('screen-quiz');
  loadQuestion();
}

function updateStreakBadge(){
  const badge = el('streakBadge');
  el('streakCount').textContent = state.streak;
  if(state.streak>=2) badge.classList.add('show');
  else badge.classList.remove('show');
}

function loadQuestion(){
  state.answered = false;
  const q = state.questions[state.index];
  const total = state.questions.length;
  el('quizProgressLabel').textContent = `Question ${state.index+1} / ${total}`;
  el('progressFill').style.width = `${(state.index/total)*100}%`;
  el('questionText').textContent = q.q;
  { const qt = el('questionText'); qt.style.animation='none'; void qt.offsetHeight; qt.style.animation=''; }

  const shuffledOptions = shuffle(q.options);
  const letters = ['A','B','C','D'];
  const list = el('answersList');
  list.innerHTML = "";
  shuffledOptions.forEach((opt,i)=>{
    const row = document.createElement('div');
    row.className = 'answer-option';
    row.style.animationDelay = (i*0.07)+'s';
    row.innerHTML = `<span class="letter">${letters[i]}</span><span class="txt">${opt}</span>`;
    row.addEventListener('click', ()=> selectAnswer(row, opt, q.answer));
    list.appendChild(row);
  });

  const ring = el('timerRing');
  ring.style.strokeDasharray = RING_CIRC;
  startTimer();
}

function startTimer(){
  clearInterval(state.timer);
  state.timeLeft = TIME_LIMIT;
  updateTimerRing();
  state.timer = setInterval(()=>{
    state.timeLeft--;
    updateTimerRing();
    if(state.timeLeft<=0){
      clearInterval(state.timer);
      if(!state.answered) timeUp();
    }
  },1000);
}

function updateTimerRing(){
  const ring = el('timerRing');
  const frac = Math.max(state.timeLeft,0)/TIME_LIMIT;
  ring.style.strokeDashoffset = RING_CIRC * (1-frac);
  ring.style.stroke = state.timeLeft<=5 ? 'var(--wrong)' : 'var(--cyan)';
  el('timerDisplay').textContent = Math.max(state.timeLeft,0);
  el('timerRingWrap').classList.toggle('low', state.timeLeft<=5 && state.timeLeft>0);
  if(state.timeLeft<=5 && state.timeLeft>0) beep(300,0.05,'square');
}

function timeUp(){
  state.answered = true;
  const q = state.questions[state.index];
  document.querySelectorAll('.answer-option').forEach(opt=>{
    opt.classList.add('disabled');
    if(opt.querySelector('.txt').textContent===q.answer) opt.classList.add('correct');
  });
  state.streak = 0;
  updateStreakBadge();
  beep(180,0.25,'sawtooth');
  flashPulse(false);
  setTimeout(nextQuestion, 1200);
}

function selectAnswer(row, chosen, correctAnswer){
  if(state.answered) return;
  state.answered = true;
  clearInterval(state.timer);
  const isCorrect = chosen === correctAnswer;
  document.querySelectorAll('.answer-option').forEach(opt=>{
    opt.classList.add('disabled');
    const txt = opt.querySelector('.txt').textContent;
    if(txt===correctAnswer) opt.classList.add('correct');
    else if(opt===row && !isCorrect) opt.classList.add('wrong');
  });
  if(isCorrect){
    state.score++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    beep(760,0.12,'sine');
  } else {
    state.streak = 0;
    beep(180,0.25,'sawtooth');
  }
  updateStreakBadge();
  flashPulse(isCorrect);
  setTimeout(nextQuestion, 900);
}

function flashPulse(isCorrect){
  const flash = el('pulseFlash');
  flash.className = 'pulse-flash ' + (isCorrect ? 'correct' : 'wrong');
  void flash.offsetWidth;
  flash.classList.add('show');
}

function nextQuestion(){
  state.index++;
  if(state.index >= state.questions.length){
    finishQuiz();
  } else {
    loadQuestion();
  }
}

function finishQuiz(){
  el('progressFill').style.width = '100%';
  const total = state.questions.length;
  const pct = state.score/total;
  let grade = 'F';
  if(pct===1) grade='A+';
  else if(pct>=0.8) grade='A';
  else if(pct>=0.6) grade='B';
  else if(pct>=0.4) grade='C';
  else if(pct>=0.2) grade='D';

  const ring = el('scoreRing');
  ring.style.strokeDasharray = SCORE_CIRC;
  ring.style.strokeDashoffset = SCORE_CIRC;
  el('scorePct').textContent = '0%';

  el('gradeWord').textContent = 'Grade ' + grade;
  el('gradeScore').textContent = `${state.score} / ${total} correct`;
  el('gradeDetail').textContent = `${state.name} — ${state.category} — ${state.difficulty}`;

  sessionScores.push({name:state.name, score:state.score, total, category:state.category, difficulty:state.difficulty});
  sessionScores.sort((a,b)=> (b.score/b.total) - (a.score/a.total));
  sessionScores = sessionScores.slice(0,5);
  renderScoreboard();

  showScreen('screen-results');

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      ring.style.strokeDashoffset = SCORE_CIRC * (1-pct);
      el('scorePct').textContent = Math.round(pct*100)+'%';
    }, 80);
  });

  if(pct>=0.6){
    setTimeout(fireConfetti, 300);
    beep(880,0.15,'sine');
    setTimeout(()=>beep(1046,0.18,'sine'), 140);
  }
}

function renderScoreboard(){
  const list = el('scoreList');
  if(sessionScores.length===0){
    list.innerHTML = '<div class="score-entry"><span class="who">No scores yet</span></div>';
    return;
  }
  list.innerHTML = sessionScores.map(s=>`
    <div class="score-entry">
      <span class="who">${s.name} — ${s.score}/${s.total}</span>
      <span class="meta">${s.category} · ${s.difficulty}</span>
    </div>
  `).join('');
}

el('retryBtn').addEventListener('click', startQuiz);
el('menuBtn').addEventListener('click', ()=> showScreen('screen-start'));
</script>
</body>
